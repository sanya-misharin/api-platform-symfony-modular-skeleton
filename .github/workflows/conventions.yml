name: Conventions

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate:
    name: Branch name & commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # dependabot and other automation branches are exempt
          case "$BRANCH" in
            dependabot/*|renovate/*) echo "Automation branch '$BRANCH' — skipped."; exit 0 ;;
          esac
          pattern='^(feat|fix|refactor|perf|docs|test|build|ci|chore|revert)/[a-z0-9._-]+$'
          if ! printf '%s' "$BRANCH" | grep -Eq "$pattern"; then
            echo "::error::Branch '$BRANCH' does not match <type>/<slug>."
            echo "Types: feat fix refactor perf docs test build ci chore revert"
            echo "Example: feat/status-endpoint"
            exit 1
          fi
          echo "Branch '$BRANCH' OK."

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|refactor|perf|docs|test|build|ci|chore|revert|style)(\([a-z0-9._/-]+\))?(!)?: .+'
          fail=0
          # %s = subject only; skip merge commits (%p has 2+ parents)
          while IFS='|' read -r parents subject; do
            case "$parents" in *" "*) continue ;; esac        # merge commit → skip
            case "$subject" in "fixup! "*|"squash! "*|"Revert "*) continue ;; esac
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::Bad commit message: $subject"
              fail=1
            fi
          done < <(git log --format='%p|%s' "$BASE_SHA..$HEAD_SHA")
          if [ "$fail" -ne 0 ]; then
            echo "Expected Conventional Commits: <type>(<scope>): <subject>"
            echo "See CONTRIBUTING.md → Commits."
            exit 1
          fi
          echo "All commit messages OK."
