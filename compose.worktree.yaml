# Overlay for running a second (or Nth) stack from a git worktree in parallel
# with the main checkout's stack. Not a Symfony Flex-managed file — safe to
# hand-edit, recipes never touch or regenerate it.
#
# compose.yaml already parametrizes HTTP_PORT/HTTPS_PORT/HTTP3_PORT via
# ${VAR:-default}; only the database port in compose.override.yaml is hardcoded
# ("5432:5432", no fallback), so that is the single thing this file overrides.
# `!override` is required: compose merges `ports:` lists by concatenation, so a
# plain redefinition would add a second binding instead of replacing the first.
#
# Usage (from inside the worktree directory):
#   HTTP_PORT=8080 HTTPS_PORT=8443 HTTP3_PORT=8443 DB_PORT=55432 \
#     docker compose -f compose.yaml -f compose.override.yaml -f compose.worktree.yaml up -d --build
#
# The compose project name defaults to the worktree directory name, so the
# stack, its containers and its `database_data` volume are isolated from the
# main checkout's — and every later `docker compose ...` run from that
# directory (exec, logs, ps, down) targets it without extra flags.
#
# Pick free ports per worktree (`docker compose ls`, `ss -tlnp`) — nothing is
# allocated automatically. See CONTRIBUTING.md § Parallel tasks (git worktree).
services:
  database:
    ports: !override
      - "${DB_PORT:-5432}:5432"
